<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    ">

  <title>Donat Delivery</title>

  <style>

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      background:#f3f4f6;
      font-family:Arial,sans-serif;
      color:#111;

      max-width:480px;
      margin:auto;

      min-height:100vh;
    }

    .header{
      background:white;
      padding:20px;
      position:sticky;
      top:0;
      z-index:999;

      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .title{
      font-size:24px;
      font-weight:bold;
    }

    .container{
      padding:16px;
    }

    .card{
      background:white;
      border-radius:24px;
      padding:18px;
      margin-bottom:18px;
    }

    .input{
      width:100%;
      border:none;
      background:#f3f4f6;
      padding:18px;
      border-radius:16px;
      font-size:16px;
      margin-top:12px;
    }

    textarea{
      min-height:90px;
      resize:none;
    }

    .btn{
      width:100%;
      border:none;
      padding:18px;
      border-radius:18px;
      font-size:16px;
      font-weight:bold;
      margin-top:14px;
      cursor:pointer;
    }

    .btn-primary{
      background:black;
      color:white;
    }

    .queue-item{
      background:white;
      border-radius:20px;
      padding:18px;
      margin-bottom:14px;
    }

    .queue-title{
      font-size:18px;
      font-weight:bold;
    }

    .queue-distance{
      margin-top:8px;
      color:#666;
    }

    .action-row{
      display:flex;
      gap:10px;
      margin-top:16px;
    }

    .action-btn{
      flex:1;
      border:none;
      padding:14px;
      border-radius:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .maps-btn{
      background:#dbeafe;
    }

    .wa-btn{
      background:#dcfce7;
    }

  </style>

</head>

<body>

  <div class="header">
    <div class="title">
      Donat Delivery 🍩
    </div>
  </div>

  <div class="container">

    <div class="card">

      <input
        class="input"
        placeholder="Nama Customer">

      <input
        class="input"
        placeholder="Nomor WhatsApp">

      <textarea
        class="input"
        placeholder="Alamat"></textarea>

      <input
        class="input"
        placeholder="Link Google Maps">

      <button
        class="btn btn-primary"
        onclick="saveCustomer()">
        Simpan Customer
      </button>

    </div>

    <div class="card">

      <button class="btn btn-primary">
        Generate Delivery Queue
      </button>

    </div>

    <div class="queue-item">

      <div class="queue-title">
        #1 Budi
      </div>

      <div class="queue-distance">
        2.4 KM
      </div>

      <div class="action-row">

        <button class="action-btn maps-btn">
          Maps
        </button>

        <button class="action-btn wa-btn">
          WhatsApp
        </button>

      </div>

    </div>

  </div>

  <script>

const API_URL =
'https://script.google.com/macros/s/AKfycbwIxvVvK5RXnBmHukkZSelM25GssapmQ6a7a-CInUCae1hehXGv9fte2QifAmLsepEpPQ/exec';

async function saveCustomer(){

  const inputs =
    document.querySelectorAll('.input');

  const data = {

    nama: inputs[0].value,
    wa: inputs[1].value,
    alamat: inputs[2].value,
    maps: inputs[3].value

  };

  try{

    const response =
      await fetch(
        API_URL + '?action=saveCustomer',
        {
          method:'POST',

          headers:{
            'Content-Type':'text/plain'
          },

          body:JSON.stringify(data)

        }
      );

    const result =
      await response.json();

    alert(result);

  }catch(err){

    alert('Gagal koneksi');

    console.log(err);

  }

}

</script>

</body>

</html>
