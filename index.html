<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    ">

  <title>Donat Tetangga</title>

  <style>

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      background:#f3f4f6;
      font-family:Arial,sans-serif;
      color:#111;

      max-width:480px;
      margin:auto;

      min-height:100vh;
    }

    .header{
      background:#ffe4ef; /* pink muda */
      padding:20px;
      position:sticky;
      top:0;
      z-index:999;
      border-bottom:1px solid #f9a8d4;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

    .title{
      font-size:24px;
      font-weight:bold;
    }

    .container{
      padding:16px;
    }

    .card{
      background:white;
      border-radius:24px;
      padding:18px;
      margin-bottom:18px;
    }

    .input{
      width:100%;
      border:none;
      background:#ffe4ef; /* pink muda */
      padding:18px;
      border-radius:16px;
      font-size:16px;
      margin-top:12px;
    }

    .input:focus{
     background:#ffd6e7;
     box-shadow:0 0 0 3px rgba(251, 207, 232, 0.6);
    }

    textarea{
      min-height:90px;
      resize:none;
    }

    .btn{
      width:100%;
      border:none;
      padding:18px;
      border-radius:18px;
      font-size:16px;
      font-weight:bold;
      margin-top:14px;
      cursor:pointer;
    }

    .btn-primary{
      background:#8b5e3c; /* cokelat */
      color:white;
    }

    .queue-item{
      background:white;
      border-radius:20px;
      padding:18px;
      margin-bottom:14px;
    }

    .queue-title{
      font-size:18px;
      font-weight:bold;
    }

    .queue-distance{
      margin-top:8px;
      color:#666;
    }

    .action-row{
      display:flex;
      gap:10px;
      margin-top:16px;
    }

    .action-btn{
      flex:1;
      border:none;
      padding:14px;
      border-radius:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .maps-btn{
      background:#f9a8d4; /* pink muda */
      color:#111;
    }

    .wa-btn{
      background:#f9a8d4; /* pink muda */
      color:#111;
    }

    .btn-primary:hover,
    .maps-btn:hover,
    .wa-btn:hover{
    transform:scale(1.02);
    opacity:0.9;
    }

    #loadingOverlay{

  position:fixed;
  inset:0;

  background:rgba(255,255,255,0.9);

  display:none;

  justify-content:center;
  align-items:center;

  z-index:99999;
}

.loader-box{

  text-align:center;
}

.spinner{

  width:56px;
  height:56px;

  border:5px solid #f3d6c1; /* warna krem donat */
  border-top:5px solid #8b5e3c; /* cokelat donat */

  border-radius:50%;

  box-shadow:0 0 12px rgba(139, 94, 60, 0.3);

  animation:spin 1s linear infinite;

  margin:auto;
}

.loading-text{

  margin-top:16px;
  font-size:16px;
  font-weight:bold;
}

@keyframes spin{

  100%{
    transform:rotate(360deg);
  }

}

    .donut-loader{
  position:relative;
  width:70px;
  height:70px;
  margin:auto;
}

/* DONAT */
.donut{
  width:100%;
  height:100%;
  background:#8b5e3c;
  border-radius:50%;
  position:relative;
}

/* lubang donat */
.donut::after{
  content:"";
  position:absolute;
  width:28px;
  height:28px;
  background:#ffe4ef;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* SPRINKLE */
.sprinkle{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f9a8d4;
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:0 -28px;
  animation:spin 1.2s linear infinite;
}

/* posisi sprinkle */
.s1{ transform:rotate(0deg) translateY(-30px); }
.s2{ transform:rotate(90deg) translateY(-30px); }
.s3{ transform:rotate(180deg) translateY(-30px); }
.s4{ transform:rotate(270deg) translateY(-30px); }

/* animasi putar */
@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

  </style>

</head>

<body>

  <div class="header">
    <div class="title">
      Donat Tetangga 🍩
    </div>
  </div>

  <div class="container">

    <div class="card">

      <input
        class="input"
        placeholder="Nama Customer">

      <input
        class="input"
        placeholder="Nomor WhatsApp">

      <textarea
        class="input"
        placeholder="Alamat"></textarea>

      <input
        class="input"
        placeholder="Link Google Maps">

      <button
        class="btn btn-primary"
        onclick="saveCustomer()">
        Submit
      </button>

    </div>

   <div class="card">

  <button
    class="btn btn-primary"
    onclick="generateQueue()">
    Generate Queue
  </button>

</div>

<div id="queueContainer"></div>

  </div>

  <script>

const API_URL =
'https://script.google.com/macros/s/AKfycbwIxvVvK5RXnBmHukkZSelM25GssapmQ6a7a-CInUCae1hehXGv9fte2QifAmLsepEpPQ/exec';

  async function saveCustomer(){

  const inputs =
    document.querySelectorAll('.input');

  const data = {

    nama: inputs[0].value,
    wa: inputs[1].value,
    alamat: inputs[2].value,
    maps: inputs[3].value

  };

  showLoading();

  try{

    const response =
      await fetch(
        API_URL + '?action=saveCustomer',
        {
          method:'POST',

          headers:{
            'Content-Type':'text/plain'
          },

          body:JSON.stringify(data)

        }
      );

    const result =
      await response.json();

    hideLoading();
    alert(result.message);

    loadQueue();
    inputs.forEach(i => i.value = '');
    inputs[0].focus();
  }catch(err){

    alert('Gagal koneksi');

    console.log(err);

  }finally{

    hideLoading();

  }

}

    async function generateQueue(){

  showLoading();

  try{

    const response =
      await fetch(
        API_URL + '?action=generateQueue',
        {
          method:'POST',

          headers:{
            'Content-Type':'text/plain'
          },

          body:JSON.stringify({})
        }
      );

    const result =
      await response.json();

    alert(typeof result.message === 'Generated'
  ? JSON.stringify(result.message)
  : result.message
);

    loadQueue();

  }catch(err){

    alert('Gagal generate queue');

    console.log(err);

  }finally{

    hideLoading();

  }

}

    async function loadQueue(){

  try{

    const response =
      await fetch(
        API_URL + '?action=getQueue',
        {
          method:'POST',

          headers:{
            'Content-Type':'text/plain'
          },

          body:JSON.stringify({})
        }
      );

    const data =
      await response.json();

    renderQueue(data);

  }catch(err){

    console.log(err);

  }

}

    function renderQueue(data){

  const container =
    document.getElementById('queueContainer');

  if(!data || data.length === 0){

    container.innerHTML =
      '<p>Tidak ada queue</p>';

    return;
  }

  let html = '';

  data.forEach(item => {

    html += `
  <div class="queue-item">

    <div class="queue-title">
      #${item.urutan} ${item.nama}
    </div>

    <div class="queue-distance">
      ${item.distance} KM
    </div>

    <div class="action-row">

     <button class="action-btn maps-btn"
      data-url="${item.maps || ''}"
      onclick="openMaps(this.getAttribute('data-url'))">
      Maps
    </button>

      <button class="action-btn wa-btn"
        onclick='openWA(${JSON.stringify(item.wa)}, ${JSON.stringify(item.urutan)}, ${JSON.stringify(item.nama)})'>
        WhatsApp
      </button>

    </div>

  </div>
`;
  });

  container.innerHTML = html;
}
    window.onload = function(){

  loadQueue();

};

    function showLoading(){

  document
    .getElementById('loadingOverlay')
    .style.display = 'flex';
}

function hideLoading(){

  document
    .getElementById('loadingOverlay')
    .style.display = 'none';
}

  function openMaps(url){

  if(!url){
    alert('Maps tidak tersedia');
    return;
  }

  // kalau belum ada https
  if(!url.startsWith('http')){
    url = 'https://' + url;
  }

  window.open(url, '_blank');
}

function openWA(number, queue, name){

  const msg = [
    `Halo Kak ${name} 👋`,
    ``,
    `🎁 Pesanan donat sedang dalam proses pengantaran, pastikan Kakak ada ditempat yaa 👒`,
    ``,
    `🎟️ Nomor antrian: #${queue}`,
    ``,
    `Terima kasih,`,
    `*DONAT TETANGGA 🍩* Manisnya sampai ke rumah kamu ✨`
  ].join('\n');
    
  const waUrl = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;

  window.open(waUrl, '_blank');
}

</script>

  <div id="loadingOverlay">
  <div class="loader-box">
    <div class="donut-loader">
      <div class="donut"></div>
      <div class="sprinkle s1"></div>
      <div class="sprinkle s2"></div>
      <div class="sprinkle s3"></div>
      <div class="sprinkle s4"></div>
    </div>
    <div class="loading-text">
      Donaaat
    </div>
  </div>
</div>

</body>

</html>
