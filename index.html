<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Donat Tetangga</title>
  <style>
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body{
      margin:0; background:#f3f4f6;
      font-family:Arial,sans-serif; color:#111;
      max-width:480px; margin:auto; min-height:100vh;
    }

    .header{
      background:#ffe4ef; padding:20px;
      position:sticky; top:0; z-index:999;
      border-bottom:1px solid #f9a8d4;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }
    .title{ font-size:24px; font-weight:bold; }

    .container{ padding:16px; }

    .card{
      background:white; border-radius:24px;
      padding:18px; margin-bottom:18px;
    }

    .input{
      width:100%; border:none; background:#ffe4ef;
      padding:18px; border-radius:16px;
      font-size:16px; margin-top:12px;
    }
    .input:focus{
      background:#ffd6e7;
      box-shadow:0 0 0 3px rgba(251,207,232,0.6);
      outline:none;
    }
    textarea{ min-height:90px; resize:none; }

    /* ── PILIHAN VARIAN & PAKET ── */
    .section-label{
      font-size:13px; font-weight:bold;
      color:#8b5e3c; margin-top:16px; margin-bottom:6px;
      padding-left:4px;
    }

    .chip-row{
      display:flex; gap:8px; flex-wrap:wrap;
    }

    .chip{
      border:2px solid #f9a8d4;
      background:white;
      padding:10px 16px;
      border-radius:50px;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
      transition:all 0.15s;
      color:#555;
    }
    .chip.active{
      background:#8b5e3c;
      border-color:#8b5e3c;
      color:white;
    }

    .qty-row{
      display:flex; align-items:center;
      gap:12px; margin-top:10px;
    }
    .qty-btn{
      width:40px; height:40px;
      border:none; border-radius:50%;
      background:#ffe4ef; font-size:20px;
      font-weight:bold; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .qty-val{
      font-size:20px; font-weight:bold;
      min-width:28px; text-align:center;
    }

    /* preview harga di form */
    .price-preview{
      margin-top:12px;
      background:#fef9f0;
      border-radius:14px;
      padding:12px 16px;
      font-size:14px;
      color:#555;
      display:none;
    }
    .price-preview.show{ display:block; }
    .price-preview strong{ color:#8b5e3c; }

    .btn{
      width:100%; border:none;
      padding:18px; border-radius:18px;
      font-size:16px; font-weight:bold;
      margin-top:14px; cursor:pointer;
    }
    .btn-primary{ background:#8b5e3c; color:white; }
    .btn-secondary{ background:#ffe4ef; color:#8b5e3c; margin-top:10px; }

    /* ── QUEUE CARD ── */
    .queue-item{
      background:white; border-radius:20px;
      padding:18px; margin-bottom:14px;
      transition:opacity 0.4s, transform 0.4s;
    }
    .queue-item.removing{ opacity:0; transform:scale(0.95); }

    .queue-header{
      display:flex; align-items:flex-start;
      justify-content:space-between; gap:8px;
    }
    .queue-title{ font-size:18px; font-weight:bold; }
    .queue-badge{
      font-size:12px; font-weight:bold;
      background:#ffe4ef; color:#8b5e3c;
      padding:4px 10px; border-radius:50px;
      white-space:nowrap; margin-top:2px;
    }

    .queue-meta{
      margin-top:8px; font-size:13px;
      color:#666; line-height:1.8;
    }
    .queue-meta span{ margin-right:12px; }

    .ongkir-tag{
      display:inline-block;
      font-size:12px; font-weight:bold;
      padding:3px 10px; border-radius:50px;
      margin-top:4px;
    }
    .ongkir-gratis{ background:#d1fae5; color:#065f46; }
    .ongkir-bayar { background:#fef3c7; color:#92400e; }

    .action-row{
      display:flex; gap:8px; margin-top:14px;
      flex-wrap:wrap;
    }
    .action-btn{
      flex:1; border:none;
      padding:12px 8px; border-radius:14px;
      font-weight:bold; cursor:pointer;
      font-size:14px; min-width:70px;
    }
    .maps-btn{ background:#f9a8d4; color:#111; }
    .wa-btn  { background:#f9a8d4; color:#111; }
    .done-btn{ background:#d1fae5; color:#065f46; }

    .btn-primary:hover, .maps-btn:hover,
    .wa-btn:hover, .done-btn:hover,
    .btn-secondary:hover{
      transform:scale(1.02); opacity:0.9;
    }

    /* ── MODAL REPEAT ORDER ── */
    .modal-overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,0.4);
      display:none; justify-content:center;
      align-items:flex-end; z-index:9999;
    }
    .modal-overlay.open{ display:flex; }

    .modal-box{
      background:white;
      border-radius:28px 28px 0 0;
      padding:24px 20px;
      width:100%; max-width:480px;
      max-height:80vh;
      display:flex; flex-direction:column;
    }
    .modal-title{ font-size:18px; font-weight:bold; margin-bottom:14px; }

    .modal-search{
      width:100%; border:none;
      background:#ffe4ef; padding:14px 18px;
      border-radius:14px; font-size:15px;
      margin-bottom:12px;
    }
    .modal-search:focus{
      background:#ffd6e7;
      box-shadow:0 0 0 3px rgba(251,207,232,0.6);
      outline:none;
    }

    .customer-list{ overflow-y:auto; flex:1; }
    .customer-item{
      padding:14px 16px; border-radius:14px;
      cursor:pointer; margin-bottom:8px;
      background:#f9fafb; transition:background 0.15s;
    }
    .customer-item:hover{ background:#ffe4ef; }
    .customer-item-name{ font-weight:bold; font-size:15px; }
    .customer-item-addr{ font-size:13px; color:#666; margin-top:2px; }

    /* modal order detail (varian+paket untuk repeat) */
    .repeat-order-box{
      background:#fef9f0; border-radius:16px;
      padding:16px; margin-top:12px;
      display:none;
    }
    .repeat-order-box.show{ display:block; }

    .modal-close{
      margin-top:14px; width:100%; border:none;
      padding:14px; border-radius:14px;
      font-weight:bold; cursor:pointer;
      background:#f3f4f6; color:#555;
    }

    /* ── LOADING ── */
    #loadingOverlay{
      position:fixed; inset:0;
      background:rgba(255,255,255,0.9);
      display:none; justify-content:center;
      align-items:center; z-index:99999;
    }
    .loader-box{ text-align:center; }
    .donut-loader{ position:relative; width:70px; height:70px; margin:auto; }
    .donut{
      width:100%; height:100%;
      background:#8b5e3c; border-radius:50%; position:relative;
    }
    .donut::after{
      content:""; position:absolute;
      width:28px; height:28px; background:#ffe4ef;
      border-radius:50%; top:50%; left:50%;
      transform:translate(-50%,-50%);
    }
    .sprinkle{
      width:8px; height:8px; border-radius:50%;
      background:#f9a8d4; position:absolute;
      top:50%; left:50%; transform-origin:0 -28px;
      animation:spin 1.2s linear infinite;
    }
    .s1{ transform:rotate(0deg) translateY(-30px); }
    .s2{ transform:rotate(90deg) translateY(-30px); }
    .s3{ transform:rotate(180deg) translateY(-30px); }
    .s4{ transform:rotate(270deg) translateY(-30px); }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }
    .loading-text{ margin-top:16px; font-size:16px; font-weight:bold; }
  </style>
</head>
<body>

<div class="header">
  <div class="title">Donat Tetangga 🍩</div>
</div>

<div class="container">

  <!-- ── FORM CUSTOMER BARU ── -->
  <div class="card">
    <input class="input" id="inputNama"  placeholder="Nama Customer">
    <input class="input" id="inputWA"    placeholder="Nomor WhatsApp">
    <textarea class="input" id="inputAlamat" placeholder="Alamat"></textarea>
    <input class="input" id="inputMaps"  placeholder="Link Google Maps">

    <div class="section-label">Varian Donat</div>
    <div class="chip-row" id="varianChips">
      <div class="chip" data-val="Susu Vanilla"  onclick="selectChip('varian',this)">🥛 Susu Vanilla</div>
      <div class="chip" data-val="Susu Cokelat" onclick="selectChip('varian',this)">🍫 Susu Cokelat</div>
    </div>

    <div class="section-label">Paket</div>
    <div class="chip-row" id="paketChips">
      <div class="chip" data-val="3_10000" onclick="selectChip('paket',this)">3 🍩 Rp10.000</div>
      <div class="chip" data-val="6_20000" onclick="selectChip('paket',this)">6 🍩 Rp20.000</div>
    </div>

    <div class="section-label">Jumlah Paket</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="changeQty('formQty',-1)">−</button>
      <div class="qty-val" id="formQty">1</div>
      <button class="qty-btn" onclick="changeQty('formQty',1)">+</button>
    </div>

    <div class="price-preview" id="formPreview"></div>

    <button class="btn btn-primary" onclick="submitCustomer()">Submit & Set Queue</button>
  </div>

  <!-- ── REPEAT ORDER ── -->
  <div class="card">
    <button class="btn btn-secondary" style="margin-top:0" onclick="openRepeatModal()">+ Repeat Order</button>
  </div>

  <div id="queueContainer"></div>
</div>

<!-- ── MODAL REPEAT ORDER ── -->
<div class="modal-overlay" id="repeatModal" onclick="closeModalIfOutside(event)">
  <div class="modal-box">
    <div class="modal-title">Repeat Order</div>
    <input class="modal-search" id="customerSearch"
      placeholder="Cari nama customer..." oninput="filterCustomers()">
    <div class="customer-list" id="customerList">
      <p style="color:#aaa;text-align:center;">Loading...</p>
    </div>

    <!-- Pilihan varian+paket untuk repeat order -->
    <div class="repeat-order-box" id="repeatOrderBox">
      <div style="font-weight:bold;margin-bottom:10px;" id="repeatCustomerName"></div>

      <div class="section-label" style="margin-top:0">Varian Donat</div>
      <div class="chip-row" id="repeatVarianChips">
        <div class="chip" data-val="Susu Vanilla"  onclick="selectChip('repeatVarian',this)">🥛 Susu Vanilla</div>
        <div class="chip" data-val="Susu Cokelat" onclick="selectChip('repeatVarian',this)">🍫 Susu Cokelat</div>
      </div>

      <div class="section-label">Paket</div>
      <div class="chip-row" id="repeatPaketChips">
        <div class="chip" data-val="3_10000" onclick="selectChip('repeatPaket',this)">3 🍩 Rp10.000</div>
        <div class="chip" data-val="6_20000" onclick="selectChip('repeatPaket',this)">6 🍩 Rp20.000</div>
      </div>

      <div class="section-label">Jumlah Paket</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty('repeatQty',-1)">−</button>
        <div class="qty-val" id="repeatQty">1</div>
        <button class="qty-btn" onclick="changeQty('repeatQty',1)">+</button>
      </div>

      <div class="price-preview show" id="repeatPreview" style="margin-top:10px;"></div>

      <button class="btn btn-primary" style="margin-top:12px;" onclick="confirmRepeat()">
        Tambahkan ke Queue
      </button>
    </div>

    <button class="modal-close" onclick="closeRepeatModal()">Tutup</button>
  </div>
</div>

<!-- ── LOADING ── -->
<div id="loadingOverlay">
  <div class="loader-box">
    <div class="donut-loader">
      <div class="donut"></div>
      <div class="sprinkle s1"></div>
      <div class="sprinkle s2"></div>
      <div class="sprinkle s3"></div>
      <div class="sprinkle s4"></div>
    </div>
    <div class="loading-text">Donaaat</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwIxvVvK5RXnBmHukkZSelM25GssapmQ6a7a-CInUCae1hehXGv9fte2QifAmLsepEpPQ/exec';

// state form
let selectedVarian = '';
let selectedPaket  = '';
let allCustomers   = [];
let selectedRepeatCustomer = null;
let selectedRepeatVarian = '';
let selectedRepeatPaket  = '';

// ─────────────────────────────────────────────
// CHIP SELECTOR
// ─────────────────────────────────────────────
function selectChip(group, el) {
  const containers = {
    varian      : 'varianChips',
    paket       : 'paketChips',
    repeatVarian: 'repeatVarianChips',
    repeatPaket : 'repeatPaketChips'
  };
  const container = document.getElementById(containers[group]);
  container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');

  if      (group === 'varian')       { selectedVarian = el.dataset.val; updateFormPreview(); }
  else if (group === 'paket')        { selectedPaket  = el.dataset.val; updateFormPreview(); }
  else if (group === 'repeatVarian') { selectedRepeatVarian = el.dataset.val; updateRepeatPreview(); }
  else if (group === 'repeatPaket')  { selectedRepeatPaket  = el.dataset.val; updateRepeatPreview(); }
}

// ─────────────────────────────────────────────
// QTY
// ─────────────────────────────────────────────
function changeQty(elId, delta) {
  const el  = document.getElementById(elId);
  const val = Math.max(1, parseInt(el.textContent) + delta);
  el.textContent = val;
  if (elId === 'formQty')   updateFormPreview();
  if (elId === 'repeatQty') updateRepeatPreview();
}

// ─────────────────────────────────────────────
// PRICE PREVIEW
// ─────────────────────────────────────────────
function hitungTotalJS(tipePaket, qty) {
  if (tipePaket === '3_10000') return qty * 10000;
  if (tipePaket === '6_20000') return qty * 20000;
  return 0;
}
function formatRp(n) {
  return 'Rp' + n.toLocaleString('id-ID');
}

function updateFormPreview() {
  const el  = document.getElementById('formPreview');
  const qty = parseInt(document.getElementById('formQty').textContent);
  if (!selectedVarian || !selectedPaket) { el.classList.remove('show'); return; }
  const total = hitungTotalJS(selectedPaket, qty);
  const label = selectedPaket === '3_10000' ? '3 donat' : '6 donat';
  el.innerHTML = `
    <strong>${selectedVarian}</strong> · ${qty}× paket ${label}<br>
    Total: <strong>${formatRp(total)}</strong>
    <em style="color:#aaa;font-size:12px;"> (ongkir dihitung dari jarak)</em>
  `;
  el.classList.add('show');
}

function updateRepeatPreview() {
  const el  = document.getElementById('repeatPreview');
  const qty = parseInt(document.getElementById('repeatQty').textContent);
  if (!selectedRepeatVarian || !selectedRepeatPaket) { el.innerHTML=''; return; }
  const total = hitungTotalJS(selectedRepeatPaket, qty);
  const label = selectedRepeatPaket === '3_10000' ? '3 donat' : '6 donat';
  el.innerHTML = `
    <strong>${selectedRepeatVarian}</strong> · ${qty}× paket ${label}<br>
    Total: <strong>${formatRp(total)}</strong>
  `;
}

// ─────────────────────────────────────────────
// SUBMIT CUSTOMER BARU
// ─────────────────────────────────────────────
async function submitCustomer() {
  const nama   = document.getElementById('inputNama').value.trim();
  const wa     = document.getElementById('inputWA').value.trim();
  const alamat = document.getElementById('inputAlamat').value.trim();
  const maps   = document.getElementById('inputMaps').value.trim();
  const qty    = parseInt(document.getElementById('formQty').textContent);

  if (!nama || !wa || !alamat || !maps) {
    alert('Nama, WA, Alamat, dan Link Maps harus diisi'); return;
  }
  if (!selectedVarian) { alert('Pilih varian donat dulu'); return; }
  if (!selectedPaket)  { alert('Pilih paket dulu'); return; }

  showLoading();

  try {
    // Step 1: simpan ke CUSTOMER_DB
    const r1 = await post('saveCustomer', { nama, wa, alamat, maps });
    if (!r1.success) { hideLoading(); alert(r1.message); return; }

    // Step 2: masukkan ke queue
    const r2 = await post('addNewToQueue', {
      customerID  : r1.customerID,
      nama, wa    : normalizeWA(wa), maps,
      lat         : r1.lat,
      lng         : r1.lng,
      varian      : selectedVarian,
      tipePaket   : selectedPaket,
      jumlahPaket : qty
    });

    hideLoading();
    alert(r2.success ? r2.message : r2.message);

    // Reset form
    ['inputNama','inputWA','inputAlamat','inputMaps'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('formQty').textContent = '1';
    document.querySelectorAll('#varianChips .chip, #paketChips .chip')
      .forEach(c => c.classList.remove('active'));
    selectedVarian = ''; selectedPaket = '';
    document.getElementById('formPreview').classList.remove('show');

    loadQueue();

  } catch(err) {
    hideLoading();
    alert('Gagal koneksi: ' + err.message);
  }
}

// ─────────────────────────────────────────────
// LOAD & RENDER QUEUE
// ─────────────────────────────────────────────
async function loadQueue() {
  try {
    const data = await post('getQueue', {});
    renderQueue(Array.isArray(data) ? data : []);
  } catch(err) { console.log(err); }
}

function renderQueue(data) {
  const container = document.getElementById('queueContainer');
  const pending   = data.filter(d => d.status !== 'Selesai');

  if (pending.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#aaa;">Tidak ada queue</p>';
    return;
  }

  let html = '';
  pending.forEach(item => {
    const ongkirVal  = parseInt(item.ongkir) || 0;
    const ongkirText = ongkirVal === 0
      ? '<span class="ongkir-tag ongkir-gratis">🎉 Gratis Ongkir</span>'
      : '<span class="ongkir-tag ongkir-bayar">🛵 Ongkir ' + formatRp(ongkirVal) + '</span>';

    const labelPaket = item.tipePaket === '3_10000' ? '3 donat' : item.tipePaket === '6_20000' ? '6 donat' : '-';
    const totalHarga = parseInt(item.totalHarga) || 0;

    // data-* attributes menghindari masalah escaping di onclick
    html += `
      <div class="queue-item" id="qi-${item.queueID}"
        data-qid="${item.queueID}"
        data-wa="${item.wa || ''}"
        data-urutan="${item.urutan}"
        data-nama="${(item.nama || '').replace(/"/g,'&quot;')}"
        data-varian="${(item.varian || '').replace(/"/g,'&quot;')}"
        data-jumlah="${item.jumlahPaket || 1}"
        data-tipe="${item.tipePaket || ''}"
        data-ongkir="${ongkirVal}"
        data-maps="${(item.maps || '').replace(/"/g,'&quot;')}">
        <div class="queue-header">
          <div class="queue-title">#${item.urutan} ${item.nama}</div>
          <div class="queue-badge">${item.distance} KM</div>
        </div>
        <div class="queue-meta">
          <span>🍩 ${item.varian || '-'}</span>
          <span>📦 ${item.jumlahPaket}× paket ${labelPaket}</span><br>
          <span>💰 ${formatRp(totalHarga)}</span>
          ${ongkirText}
        </div>
        <div class="action-row">
          <button class="action-btn maps-btn" onclick="openMapsFromCard(this)">Maps</button>
          <button class="action-btn wa-btn"   onclick="openWAFromCard(this)">WhatsApp</button>
          <button class="action-btn done-btn" onclick="markDoneFromCard(this)">✓ Selesai</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function getCardData(btn) {
  const card = btn.closest('.queue-item');
  return {
    queueID : card.dataset.qid,
    wa      : card.dataset.wa,
    urutan  : card.dataset.urutan,
    nama    : card.dataset.nama,
    varian  : card.dataset.varian,
    jumlah  : parseInt(card.dataset.jumlah),
    tipe    : card.dataset.tipe,
    ongkir  : parseInt(card.dataset.ongkir),
    maps    : card.dataset.maps
  };
}

function openMapsFromCard(btn) {
  let url = getCardData(btn).maps;
  if (!url) { alert('Maps tidak tersedia'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;
  window.open(url, '_blank');
}

function openWAFromCard(btn) {
  const d = getCardData(btn);
  openWA(d.wa, d.urutan, d.nama, d.varian, d.jumlah, d.tipe, d.ongkir);
}

async function markDoneFromCard(btn) {
  const queueID = getCardData(btn).queueID;
  if (!confirm('Tandai pesanan ini sebagai selesai?')) return;

  const el = document.getElementById('qi-' + queueID);
  if (el) { el.classList.add('removing'); await sleep(400); }

  try {
    const r = await post('completeQueue', { queueID });
    if (r.success) {
      if (el) el.remove();
      loadQueue();
    } else {
      alert(r.message);
      if (el) el.classList.remove('removing');
    }
  } catch(err) {
    alert('Gagal koneksi');
    if (el) el.classList.remove('removing');
  }
}

// ─────────────────────────────────────────────
// MODAL REPEAT ORDER
// ─────────────────────────────────────────────
async function openRepeatModal() {
  document.getElementById('repeatModal').classList.add('open');
  document.getElementById('customerSearch').value = '';
  document.getElementById('repeatOrderBox').classList.remove('show');
  selectedRepeatCustomer = null;
  selectedRepeatVarian   = '';
  selectedRepeatPaket    = '';

  try {
    allCustomers = await post('getCustomers', {});
    renderCustomerList(allCustomers);
  } catch(err) {
    document.getElementById('customerList').innerHTML =
      '<p style="color:#f87171;text-align:center;">Gagal memuat data</p>';
  }
}

function closeRepeatModal() {
  document.getElementById('repeatModal').classList.remove('open');
}
function closeModalIfOutside(e) {
  if (e.target.id === 'repeatModal') closeRepeatModal();
}

function filterCustomers() {
  const q = document.getElementById('customerSearch').value.toLowerCase();
  renderCustomerList(allCustomers.filter(c =>
    c.nama.toLowerCase().includes(q) ||
    (c.alamat && c.alamat.toLowerCase().includes(q))
  ));
}

function renderCustomerList(list) {
  const el = document.getElementById('customerList');
  if (!list || list.length === 0) {
    el.innerHTML = '<p style="color:#aaa;text-align:center;">Customer tidak ditemukan</p>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="customer-item" onclick="selectRepeatCustomer('${c.customerID}', '${c.nama}', '${c.alamat || ''}')">
      <div class="customer-item-name">${c.nama}</div>
      <div class="customer-item-addr">${c.alamat || '-'}</div>
    </div>
  `).join('');
}

function selectRepeatCustomer(customerID, nama, alamat) {
  selectedRepeatCustomer = customerID;

  // Reset pilihan
  document.getElementById('repeatQty').textContent = '1';
  document.querySelectorAll('#repeatVarianChips .chip, #repeatPaketChips .chip')
    .forEach(c => c.classList.remove('active'));
  selectedRepeatVarian = '';
  selectedRepeatPaket  = '';
  document.getElementById('repeatPreview').innerHTML = '';

  document.getElementById('repeatCustomerName').textContent = '🍩 ' + nama;
  document.getElementById('repeatOrderBox').classList.add('show');
  document.getElementById('customerList').scrollTop = 0;
}

async function confirmRepeat() {
  if (!selectedRepeatCustomer) { alert('Pilih customer dulu'); return; }
  if (!selectedRepeatVarian)   { alert('Pilih varian donat'); return; }
  if (!selectedRepeatPaket)    { alert('Pilih paket'); return; }

  const qty = parseInt(document.getElementById('repeatQty').textContent);

  closeRepeatModal();
  showLoading();

  try {
    const r = await post('addRepeatToQueue', {
      customerID  : selectedRepeatCustomer,
      tipePaket   : selectedRepeatPaket,
      jumlahPaket : qty,
      varian      : selectedRepeatVarian
    });
    hideLoading();
    alert(r.message);
    if (r.success) loadQueue();
  } catch(err) {
    hideLoading();
    alert('Gagal menambahkan repeat order');
  }
}

// ─────────────────────────────────────────────
// WHATSAPP
// ─────────────────────────────────────────────
function openWA(number, queue, name, varian, jumlah, tipePaket, ongkir) {
  const labelPaket = tipePaket === '3_10000' ? '3 donat' : '6 donat';
  const hargaPaket = tipePaket === '3_10000' ? 10000 : 20000;
  const total      = jumlah * hargaPaket;
  const ongkirText = ongkir === 0 ? 'GRATIS 🎉' : formatRp(ongkir);

  const msg = [
    `Halo Kak ${name} 👋`,
    ``,
    `🎁 Pesanan donat sedang dalam proses pengantaran, pastikan Kakak ada di tempat yaa 👒`,
    ``,
    `📋 Detail Pesanan:`,
    `🍩 Varian   : ${varian}`,
    `📦 Paket    : ${jumlah}× (${labelPaket})`,
    `💰 Total    : ${formatRp(total)}`,
    `🛵 Ongkir   : ${ongkirText}`,
    ``,
    `🎟️ Nomor antrian: #${queue}`,
    ``,
    `Terima kasih,`,
    `*DONAT TETANGGA 🍩* Manisnya sampai ke rumah kamu ✨`
  ].join('\n');

  window.open(`https://wa.me/${number}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function openMaps(url) {
  if (!url) { alert('Maps tidak tersedia'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;
  window.open(url, '_blank');
}

function normalizeWA(number) {
  number = number.toString().trim();
  if (number.startsWith('08'))  return '62' + number.substring(1);
  if (number.startsWith('+62')) return number.replace('+', '');
  return number;
}

async function post(action, data) {
  const response = await fetch(API_URL + '?action=' + action, {
    method  : 'POST',
    headers : { 'Content-Type': 'text/plain' },
    body    : JSON.stringify(data)
  });
  return response.json();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

window.onload = loadQueue;
</script>
